name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit, not a mutable tag. Bump deliberately (see references/supply-chain.md).
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          # Default GITHUB_TOKEN is fine. To let the Release PR's merge
          # trigger OTHER workflows (e.g. validate), swap in a PAT:
          # token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
